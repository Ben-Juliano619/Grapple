# Builds a signed release of the iOS app on a GitHub-hosted Mac and uploads it
# to TestFlight. Run it by hand: Actions tab -> "iOS TestFlight" -> Run workflow.
#
# One-time setup (needs a paid Apple Developer account):
#   1. App Store Connect -> Apps -> "+" -> New App, bundle ID
#      com.grapplewrestling.cardgame (register it under Certificates, IDs &
#      Profiles -> Identifiers first if it isn't offered).
#   2. App Store Connect -> Users and Access -> Integrations -> App Store
#      Connect API -> generate a Team key with the **Admin** role (needed so
#      the build can create its own signing certificate). Download the .p8.
#   3. In this repo: Settings -> Secrets and variables -> Actions:
#        Secrets:   APP_STORE_CONNECT_KEY_ID      (the key's ID)
#                   APP_STORE_CONNECT_ISSUER_ID   (shown above the keys list)
#                   APP_STORE_CONNECT_KEY_P8      (full contents of the .p8 file)
#        Variables: APPLE_TEAM_ID                 (Membership details -> Team ID)
#                   NEXT_PUBLIC_SOCKET_URL        (your game server, e.g. https://...)
name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL }}
    steps:
      - name: Check setup
        run: |
          missing=""
          [ -z "$KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID(secret)"
          [ -z "$ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID(secret)"
          [ -z "$KEY_P8" ] && missing="$missing APP_STORE_CONNECT_KEY_P8(secret)"
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID(variable)"
          # Without this the app would talk to the fallback URL, which may not be the game server.
          [ -z "$NEXT_PUBLIC_SOCKET_URL" ] && missing="$missing NEXT_PUBLIC_SOCKET_URL(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo settings:$missing (see the comment at the top of this workflow)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static frontend and sync into Xcode project
        run: npm run ios:sync

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$KEY_P8" > ~/private_keys/AuthKey_${KEY_ID}.p8
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive (signed automatically via the API key)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Upload to TestFlight
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It appears in App Store Connect -> TestFlight after Apple finishes processing (usually 5-15 minutes)."

      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys
